<div class="p-4 md:p-6">
  <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6">
    Gestión de Respaldos (BD)
  </h2>

  <button
    (click)="generarNuevoBackup()"
    class="w-full md:w-auto bg-emerald-600 text-white px-4 py-3 md:py-2 rounded-lg hover:bg-emerald-700 transition-all mb-6 shadow-md font-medium"
  >
    Generar Nuevo Respaldo
  </button>

  <div *ngIf="mensaje" class="p-4 mb-6 bg-blue-100 text-blue-700 rounded-lg text-sm md:text-base">
    {{ mensaje }}
  </div>

  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full responsive-table">
      <thead class="bg-slate-100">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">
            Archivo
          </th>
          <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">
            Fecha
          </th>
          <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">
            Tamaño
          </th>
          <th
            class="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider"
          >
            Acciones
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of backups" class="border-b hover:bg-slate-50 transition-colors">
          <td class="px-6 py-4 font-medium text-slate-700" data-label="Archivo">
            {{ b.nombre }}
          </td>

          <td class="px-6 py-4 text-slate-500" data-label="Fecha">
            {{ b.fecha_creacion | date: 'medium' }}
          </td>

          <td class="px-6 py-4 text-slate-500" data-label="Tamaño">{{ b.tamano }} MB</td>

          <td class="px-6 py-4 text-right" data-label="Acciones">
            <button
              (click)="restaurar(b.nombre)"
              class="text-red-600 hover:text-red-800 font-bold bg-red-50 md:bg-transparent px-3 py-1 md:p-0 rounded-md md:rounded-none"
            >
              Restaurar
            </button>
          </td>
        </tr>

        <tr *ngIf="backups.length === 0 && !cargando">
          <td colspan="4" class="px-6 py-8 text-center text-slate-500">
            No hay respaldos generados aún.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
